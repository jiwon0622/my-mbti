
<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>MBTI로 포켓몬 찾기 ✦</title>

  <style>
    * {
      box-sizing: border-box;
    }

    :root {
      --navy: #090e2c;
      --deep-blue: #111747;
      --cream: #fff8e8;
      --gold: #ffe78a;
      --purple: #c5a4ff;
      --pink: #ff9fe4;
    }

    html {
      scroll-behavior: smooth;
    }

    body {
      margin: 0;
      padding: 30px 16px;
      color: #fff8ef;
      font-family: "Malgun Gothic", "Apple SD Gothic Neo",
                   sans-serif;
      text-align: center;
      background:
        radial-gradient(ellipse at 15% 15%,
          rgba(77, 75, 173, 0.35), transparent 35%),
        radial-gradient(ellipse at 85% 50%,
          rgba(70, 49, 143, 0.3), transparent 40%),
        linear-gradient(180deg, #080d29 0%, #151b4a 50%,
          #0a1030 100%);
      min-height: 100vh;
      overflow-x: hidden;
      position: relative;
    }

    /* 밤하늘의 별 */
    body::before {
      content: "";
      position: fixed;
      inset: 0;
      z-index: 0;
      pointer-events: none;
      background-image:
        radial-gradient(circle, #fff 1px, transparent 1.8px),
        radial-gradient(circle, #ffe9a8 1.3px, transparent 2px),
        radial-gradient(circle, #b8c8ff 1px, transparent 2px),
        radial-gradient(circle, #d6a9ff 1.2px, transparent 2px);
      background-size: 91px 97px, 137px 151px,
                       183px 167px, 211px 193px;
      background-position: 0 0, 31px 42px,
                           74px 17px, 120px 90px;
      opacity: 0.65;
      animation: skyTwinkle 5s ease-in-out infinite alternate;
    }

    @keyframes skyTwinkle {
      from { opacity: 0.35; }
      to { opacity: 0.8; }
    }

    .container {
      max-width: 850px;
      margin: 0 auto;
      position: relative;
      z-index: 1;
    }

    .header {
      padding: 25px 15px 28px;
      position: relative;
    }

    .top-emoji {
      font-size: 65px;
      margin-bottom: 10px;
      display: inline-block;
      filter: drop-shadow(0 0 18px #ffe78a);
      animation: floatMoon 3s ease-in-out infinite;
    }

    @keyframes floatMoon {
      0%, 100% { transform: translateY(0) rotate(-5deg); }
      50% { transform: translateY(-9px) rotate(5deg); }
    }

    h1 {
      margin: 8px 0 14px;
      font-size: clamp(29px, 6vw, 45px);
      color: #ffe89a;
      letter-spacing: -1.5px;
      text-shadow:
        0 0 10px rgba(255, 225, 132, 0.8),
        0 0 28px rgba(255, 190, 100, 0.35);
    }

    .subtitle {
      font-size: 17px;
      line-height: 1.9;
      color: #d4d9ff;
    }

    .section {
      background: rgba(15, 21, 63, 0.84);
      border: 1px solid rgba(166, 161, 255, 0.7);
      border-radius: 27px;
      padding: 28px 22px;
      margin: 22px 0;
      box-shadow:
        0 0 25px rgba(92, 94, 255, 0.12),
        inset 0 0 25px rgba(120, 120, 255, 0.04);
      backdrop-filter: blur(8px);
      position: relative;
    }

    h2 {
      font-size: 24px;
      margin: 0 0 10px;
      color: #fff0b4;
      text-shadow: 0 0 12px rgba(255, 222, 133, 0.3);
    }

    .hint {
      color: #bfc8f8;
      font-size: 15px;
      margin-bottom: 25px;
    }

    /* 무지개 별 모양 MBTI 버튼 */
    .mbti-grid {
      display: grid;
      grid-template-columns: repeat(4, minmax(0, 1fr));
      gap: 15px 10px;
      max-width: 580px;
      margin: 0 auto;
    }

    .mbti-btn {
      --star-color: #ff83c8;
      --star-light: #ffd0ed;

      appearance: none;
      border: none;
      background: linear-gradient(
        145deg, var(--star-light), var(--star-color) 70%
      );
      color: #fff;
      aspect-ratio: 1 / 0.96;
      width: 100%;
      min-width: 0;
      max-width: 110px;
      justify-self: center;
      padding: 18px 2px 8px;
      clip-path: polygon(
        50% 0%,
        61% 29%,
        92% 25%,
        75% 49%,
        83% 80%,
        54% 70%,
        33% 94%,
        29% 65%,
        2% 50%,
        31% 37%
      );
      /* 더 익숙한 다섯 꼭짓점 별 모양 */
      clip-path: polygon(
        50% 2%, 62% 34%, 97% 35%,
        70% 56%, 80% 91%, 50% 71%,
        20% 91%, 30% 56%, 3% 35%, 38% 34%
      );
      font-size: clamp(13px, 2.7vw, 17px);
      font-weight: 900;
      text-shadow: 0 1px 4px rgba(38, 25, 73, 0.7);
      cursor: pointer;
      filter: drop-shadow(0 0 7px var(--star-color));
      transition: transform 0.2s, filter 0.2s;
      position: relative;
    }

    .mbti-btn:hover {
      transform: scale(1.12) rotate(-4deg);
      filter:
        drop-shadow(0 0 8px var(--star-color))
        drop-shadow(0 0 17px var(--star-color));
      z-index: 2;
    }

    .mbti-btn:active {
      transform: scale(0.94);
    }

    .mbti-btn:focus-visible,
    .reset-btn:focus-visible {
      outline: 3px solid #fff;
      outline-offset: 4px;
    }

    .mbti-btn:nth-child(8n + 1) {
      --star-color: #ff66b1;
      --star-light: #ffb0da;
    }

    .mbti-btn:nth-child(8n + 2) {
      --star-color: #ff9a52;
      --star-light: #ffe0a1;
    }

    .mbti-btn:nth-child(8n + 3) {
      --star-color: #ffd44f;
      --star-light: #fff3a2;
    }

    .mbti-btn:nth-child(8n + 4) {
      --star-color: #a3e85e;
      --star-light: #e2ff9b;
    }

    .mbti-btn:nth-child(8n + 5) {
      --star-color: #56dfb4;
      --star-light: #b3ffe4;
    }

    .mbti-btn:nth-child(8n + 6) {
      --star-color: #49dbe9;
      --star-light: #b0faff;
    }

    .mbti-btn:nth-child(8n + 7) {
      --star-color: #668aff;
      --star-light: #c0d1ff;
    }

    .mbti-btn:nth-child(8n) {
      --star-color: #b57bff;
      --star-light: #e0baff;
    }

    /* 결과 창 */
    .result {
      display: none;
      overflow: hidden;
      border: 1px solid rgba(255, 222, 140, 0.8);
      background:
        radial-gradient(ellipse at 50% 20%,
          rgba(96, 90, 183, 0.34), transparent 55%),
        rgba(13, 19, 57, 0.95);
      box-shadow:
        0 0 20px rgba(130, 120, 255, 0.18),
        0 0 45px rgba(255, 206, 120, 0.08),
        inset 0 0 35px rgba(134, 130, 255, 0.08);
      animation: appear 0.6s ease both;
    }

    @keyframes appear {
      from {
        opacity: 0;
        transform: translateY(18px) scale(0.97);
      }
      to {
        opacity: 1;
        transform: translateY(0) scale(1);
      }
    }

    /* 결과 창 주변의 별 장식 */
    .sparkle {
      position: absolute;
      pointer-events: none;
      color: #fff0a9;
      font-size: 27px;
      z-index: 2;
      text-shadow: 0 0 8px #ffe78a, 0 0 20px #ffdb77;
      animation: sparkle 1.8s ease-in-out infinite;
    }

    .sparkle.s1 { top: 7%; left: 5%; }
    .sparkle.s2 { top: 13%; right: 7%; color: #e1b9ff;
                  animation-delay: 0.4s; }
    .sparkle.s3 { top: 29%; left: 3%; font-size: 20px;
                  animation-delay: 0.8s; }
    .sparkle.s4 { top: 36%; right: 4%; color: #ffb4e5;
                  animation-delay: 0.2s; }
    .sparkle.s5 { top: 55%; left: 5%; animation-delay: 1s; }
    .sparkle.s6 { top: 66%; right: 5%; color: #c3d0ff;
                  animation-delay: 0.6s; }
    .sparkle.s7 { top: 81%; left: 7%; font-size: 21px;
                  animation-delay: 0.3s; }
    .sparkle.s8 { top: 87%; right: 7%; color: #ffb4e5;
                  animation-delay: 0.9s; }

    @keyframes sparkle {
      0%, 100% {
        opacity: 0.35;
        transform: scale(0.65) rotate(0deg);
      }
      50% {
        opacity: 1;
        transform: scale(1.2) rotate(35deg);
      }
    }

    .result-label {
      display: inline-block;
      position: relative;
      z-index: 3;
      background: linear-gradient(135deg, #fff1bc, #ffc9ec);
      color: #5b428e;
      padding: 10px 20px;
      border-radius: 30px;
      font-size: 15px;
      font-weight: bold;
      margin: 0 0 15px;
      box-shadow: 0 0 18px rgba(255, 218, 155, 0.22);
    }

    .pokemon-emoji {
      position: relative;
      z-index: 1;
      font-size: clamp(90px, 20vw, 135px);
      line-height: 1.5;
      margin: 5px 0;
      filter: drop-shadow(0 0 17px rgba(255, 219, 123, 0.55));
      animation: pokemonFloat 3s ease-in-out infinite;
    }

    @keyframes pokemonFloat {
      0%, 100% { transform: translateY(0); }
      50% { transform: translateY(-8px); }
    }

    .pokemon-name {
      font-size: clamp(30px, 6vw, 40px);
      color: #ffe89a;
      margin: 0 0 12px;
      text-shadow: 0 0 15px rgba(255, 216, 111, 0.3);
      position: relative;
      z-index: 3;
    }

    .pokemon-desc {
      max-width: 570px;
      margin: 0 auto;
      font-size: 17px;
      line-height: 1.9;
      color: #e3ddff;
      word-break: keep-all;
      position: relative;
      z-index: 3;
    }

    .reason-box {
      position: relative;
      z-index: 3;
      margin: 24px auto;
      max-width: 600px;
      background: linear-gradient(135deg, #fff9e8, #fff0cf);
      border: 2px solid #ffdf87;
      border-radius: 20px;
      padding: 21px;
      text-align: left;
      color: #59496c;
      box-shadow: 0 0 20px rgba(255, 217, 126, 0.09);
    }

    .reason-box h3 {
      font-size: 19px;
      margin: 0 0 12px;
      color: #8d6721;
    }

    .reason-box p {
      font-size: 16px;
      line-height: 1.9;
      margin: 0;
      word-break: keep-all;
    }

    .compatibility {
      position: relative;
      z-index: 3;
      max-width: 600px;
      margin: 0 auto 25px;
      padding: 22px;
      border: 2px solid #d9bdff;
      border-radius: 20px;
      background: linear-gradient(135deg, #fff5fb, #f0efff);
      color: #574775;
      box-shadow: 0 0 18px rgba(202, 166, 255, 0.12);
    }

    .compatibility .heart {
      font-size: 35px;
      margin-bottom: 8px;
      animation: heartBeat 2s ease-in-out infinite;
    }

    @keyframes heartBeat {
      0%, 100% { transform: scale(1); }
      50% { transform: scale(1.12); }
    }

    .compatibility h3 {
      margin: 0 0 10px;
      color: #7650bd;
      font-size: 19px;
    }

    .compat-type {
      display: inline-block;
      font-size: 22px;
      font-weight: bold;
      color: #fff;
      background: linear-gradient(135deg, #ee78c7, #8f7aff);
      padding: 11px 20px;
      border-radius: 13px;
      margin: 5px 0 12px;
      box-shadow: 0 4px 13px rgba(157, 105, 225, 0.25);
    }

    .compatibility p {
      font-size: 15px;
      line-height: 1.8;
      color: #655a86;
      margin: 5px 0 0;
      word-break: keep-all;
    }

    .reset-btn {
      position: relative;
      z-index: 3;
      border: 1px solid #fff0a0;
      border-radius: 30px;
      padding: 15px 32px;
      background: linear-gradient(135deg, #fff0a1, #ffca65);
      color: #5d431a;
      font-size: 17px;
      font-weight: bold;
      cursor: pointer;
      box-shadow: 0 0 18px rgba(255, 215, 112, 0.2);
      transition: 0.2s;
    }

    .reset-btn:hover {
      background: linear-gradient(135deg, #fff6c7, #ffdb83);
      transform: translateY(-3px);
      box-shadow: 0 0 25px rgba(255, 215, 112, 0.4);
    }

    .footer {
      padding: 22px 10px;
      color: #aeb9e9;
      font-size: 13px;
      line-height: 1.9;
    }

    @media (max-width: 480px) {
      body {
        padding: 15px 10px;
      }

      .section {
        padding: 24px 13px;
      }

      .mbti-grid {
        gap: 12px 5px;
      }

      .mbti-btn {
        font-size: 13px;
        padding: 13px 0 7px;
      }

      .pokemon-desc {
        font-size: 16px;
      }

      .reason-box,
      .compatibility {
        padding: 17px 14px;
      }

      .sparkle {
        font-size: 21px;
      }
    }

    /* 움직임 줄이기를 설정한 사용자를 위한 배려 */
    @media (prefers-reduced-motion: reduce) {
      *,
      *::before,
      *::after {
        animation-duration: 0.01ms !important;
        animation-iteration-count: 1 !important;
        scroll-behavior: auto !important;
        transition-duration: 0.01ms !important;
      }
    }
  </style>
</head>

<body>
  <main class="container">

    <header class="header">
      <div class="top-emoji">🌙</div>
      <h1>✦ MBTI로 포켓몬 찾기 ✦</h1>
      <p class="subtitle">
        내 성격과 찰떡궁합인 포켓몬은 누구일까?<br>
        MBTI를 선택하고 나만의 포켓몬을 찾아봐! ⭐
      </p>
    </header>

    <section class="section" id="selectSection">
      <h2>⭐ 나의 MBTI는?</h2>
      <p class="hint">반짝이는 별을 누르고 내 포켓몬을 찾아봐!</p>

      <div class="mbti-grid" id="mbtiGrid">
        <button class="mbti-btn" data-type="ISTJ">ISTJ</button>
        <button class="mbti-btn" data-type="ISFJ">ISFJ</button>
        <button class="mbti-btn" data-type="INFJ">INFJ</button>
        <button class="mbti-btn" data-type="INTJ">INTJ</button>

        <button class="mbti-btn" data-type="ISTP">ISTP</button>
        <button class="mbti-btn" data-type="ISFP">ISFP</button>
        <button class="mbti-btn" data-type="INFP">INFP</button>
        <button class="mbti-btn" data-type="INTP">INTP</button>

        <button class="mbti-btn" data-type="ESTP">ESTP</button>
        <button class="mbti-btn" data-type="ESFP">ESFP</button>
        <button class="mbti-btn" data-type="ENFP">ENFP</button>
        <button class="mbti-btn" data-type="ENTP">ENTP</button>

        <button class="mbti-btn" data-type="ESTJ">ESTJ</button>
        <button class="mbti-btn" data-type="ESFJ">ESFJ</button>
        <button class="mbti-btn" data-type="ENFJ">ENFJ</button>
        <button class="mbti-btn" data-type="ENTJ">ENTJ</button>
      </div>
    </section>

    <section class="section result" id="resultSection"
             aria-live="polite">

      <!-- 결과 창 주변을 떠다니는 반짝이 -->
      <span class="sparkle s1" aria-hidden="true">✦</span>
      <span class="sparkle s2" aria-hidden="true">✧</span>
      <span class="sparkle s3" aria-hidden="true">✦</span>
      <span class="sparkle s4" aria-hidden="true">✧</span>
      <span class="sparkle s5" aria-hidden="true">✧</span>
      <span class="sparkle s6" aria-hidden="true">✦</span>
      <span class="sparkle s7" aria-hidden="true">✦</span>
      <span class="sparkle s8" aria-hidden="true">✧</span>

      <div class="result-label" id="resultType">나의 MBTI</div>

      <div class="pokemon-emoji" id="pokemonEmoji">⚡</div>

      <h2 class="pokemon-name" id="pokemonName">피카츄</h2>

      <p class="pokemon-desc" id="pokemonDesc"></p>

      <div class="reason-box">
        <h3>⭐ 너와 닮은 이유</h3>
        <p id="pokemonReason"></p>
      </div>

      <div class="compatibility">
        <div class="heart">💕</div>
        <h3>너와 잘 맞을 것 같은 유형</h3>
        <div class="compat-type" id="compatType">ENFP</div>
        <p id="compatReason"></p>
      </div>

      <button class="reset-btn" id="resetBtn">
        ✨ 다시 고르기
      </button>
    </section>

    <footer class="footer">
      ✦ 별빛 아래에서 찾아보는 나만의 포켓몬 ✦<br>
      포켓몬과 MBTI를 재미있게 연결한 성격 놀이야!<br>
      실제 성격이나 궁합을 과학적으로 판단하는 검사는 아니야. 🌙
    </footer>

  </main>

  <script>
    // MBTI 유형별 포켓몬, 성격 설명, 궁합 정보
    const pokemonData = {
      ISTJ: {
        name: "꼬부기",
        emoji: "🐢",
        desc: "차분하고 믿음직한 꼬부기!",
        reason: "꼼꼼하고 책임감이 강한 ISTJ는 맡은 일을 꾸준히 해내는 편이야. 꼬부기처럼 침착하게 상황을 살피며 자기 역할을 확실히 해내는 모습이 닮았어.",
        compat: "ESFP",
        compatReason: "ESFP의 밝고 활발한 에너지가 ISTJ의 일상에 새로운 즐거움을 더해 줄 수 있어!"
      },

      ISFJ: {
        name: "이브이",
        emoji: "🦊",
        desc: "다정하고 배려심 많은 이브이!",
        reason: "ISFJ는 주변 사람을 세심하게 챙기고 따뜻한 관계를 소중히 여기는 편이야. 다양한 모습으로 성장하는 이브이처럼 상대에게 맞춰 주는 다정함이 닮았어.",
        compat: "ESFP",
        compatReason: "ESFP의 밝은 성격과 ISFJ의 따뜻한 배려가 만나면 편안하고 즐거운 관계를 만들 수 있어!"
      },

      INFJ: {
        name: "루카리오",
        emoji: "🐺",
        desc: "깊은 통찰력과 신념을 지닌 루카리오!",
        reason: "INFJ는 사람의 마음을 이해하려 하고 자신만의 가치관을 중요하게 생각해. 파동을 감지하는 루카리오처럼 겉으로 드러나지 않는 마음까지 살피려는 모습이 닮았어.",
        compat: "ENTP",
        compatReason: "ENTP의 새로운 관점과 INFJ의 깊은 생각이 만나면 서로의 세계를 넓혀 갈 수 있어!"
      },

      INTJ: {
        name: "뮤츠",
        emoji: "🧬",
        desc: "분석적이고 전략적인 뮤츠!",
        reason: "INTJ는 복잡한 문제를 분석하고 장기적인 계획을 세우는 데 관심이 많아. 뛰어난 지능을 지닌 뮤츠처럼 논리적으로 생각하고 자신만의 목표를 추구하는 모습이 닮았어.",
        compat: "ENFP",
        compatReason: "ENFP의 창의적인 아이디어와 INTJ의 전략적인 사고가 만나면 예상하지 못한 멋진 결과를 만들 수 있어!"
      },

      ISTP: {
        name: "메타그로스",
        emoji: "🤖",
        desc: "논리와 분석의 달인 메타그로스!",
        reason: "ISTP는 문제의 원인을 파악하고 직접 해결하는 것을 좋아하는 편이야. 네 개의 뇌를 가진 메타그로스처럼 복잡한 상황에서도 냉철하게 분석하는 모습이 닮았어.",
        compat: "ESTJ",
        compatReason: "ESTJ의 실행력과 ISTP의 실용적인 문제 해결 능력이 만나면 일을 효율적으로 진행할 수 있어!"
      },

      ISFP: {
        name: "치라미",
        emoji: "🐭",
        desc: "섬세하고 감각적인 치라미!",

    const mbtiGrid = document.getElementById("mbtiGrid");
    const selectSection = document.getElementById("selectSection");
    const resultSection = document.getElementById("resultSection");
    const resetBtn = document.getElementById("resetBtn");

    // MBTI 버튼을 누르면 해당 포켓몬 결과를 표시해.
    mbtiGrid.addEventListener("click", function(event) {
      const button = event.target.closest("button[data-type]");

      if (!button) return;

      const type = button.dataset.type;
      const data = pokemonData[type];

      if (!data) return;

      document.getElementById("resultType").textContent =
        "나의 MBTI · " + type;

      document.getElementById("pokemonEmoji").textContent =
        data.emoji;

      document.getElementById("pokemonName").textContent =
        data.name;

      document.getElementById("pokemonDesc").textContent =
        data.desc;

      document.getElementById("pokemonReason").textContent =
        data.reason;

      document.getElementById("compatType").textContent =
        data.compat;

      document.getElementById("compatReason").textContent =
        data.compatReason;

      // 결과 창을 보여 주고 별빛 효과를 다시 시작해.
      resultSection.style.display = "block";
      selectSection.style.display = "none";

      resultSection.style.animation = "none";
      void resultSection.offsetWidth;
      resultSection.style.animation = "";

      window.scrollTo({
        top: 0,
        behavior: "smooth"
      });
    });

    // 다시 고르기를 누르면 MBTI 선택 화면으로 돌아가.
    resetBtn.addEventListener("click", function() {
      resultSection.style.display = "none";
      selectSection.style.display = "block";

      window.scrollTo({
        top: 0,
        behavior: "smooth"
      });
    });
